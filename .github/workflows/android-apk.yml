name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Ensure gradlew is executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Stage APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk THH-Ticket-Codes.apk

      - name: Publish "latest" release with the APK
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Latest build
          body: |
            Automatic build from the latest push to `main` (commit ${{ github.sha }}).

            **To install on Android:** on your phone, open this page, download
            `THH-Ticket-Codes.apk` below, open the downloaded file, and allow installing from
            this source when prompted (Android will offer to let you do this the first time).

            This is a debug build meant for direct install/testing — not a Play Store release,
            so Android will warn that it's from an unrecognized developer. That's expected.
          artifacts: THH-Ticket-Codes.apk
          allowUpdates: true
          replacesArtifacts: true
          removeArtifacts: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
