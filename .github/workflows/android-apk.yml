name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Use a stable signing key
        run: cp .github/keystore/debug.keystore android/app/debug.keystore

      - name: Ensure gradlew is executable
        run: chmod +x android/gradlew

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Stage APK
        run: cp android/app/build/outputs/apk/release/app-release.apk THH-Ticket-Codes.apk

      - name: Publish "latest" release with the APK
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Latest build
          body: |
            Automatic build from the latest push to `main` (commit ${{ github.sha }}).

            **To install on Android:** on your phone, open this page, download
            `THH-Ticket-Codes.apk` below, open the downloaded file, and allow installing from
            this source when prompted (Android will offer to let you do this the first time).

            This build has the JS bundle embedded (it runs standalone, no computer needed)
            and is signed with a fixed key committed in this repo — not a Play Store release,
            so Android will warn that it's from an unrecognized developer. That's expected.
          artifacts: THH-Ticket-Codes.apk
          allowUpdates: true
          replacesArtifacts: true
          removeArtifacts: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
